# Local dev DB + Redis only -- no app container.
#
# Run this alongside the "CEVA-MP" / "Migrate" / "Upgrade DB" / "Downgrade DB"
# debugpy launch configs, which run Flask directly on the host and connect to
# these services on localhost.
#
#   docker compose -f docker-compose.local.yml up -d
#
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_local_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_local_data:
  redis_local_data:
