upstream marketplace_app {
    server unix:/run/marketplace/gunicorn.sock fail_timeout=0;
}

limit_req_zone $binary_remote_addr zone=marketplace_rl:10m rate=10r/s;

server {
    listen 80;
    server_name marketplace.example.com;

    # Redirect everything to HTTPS; ACME challenge stays on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name marketplace.example.com;

    ssl_certificate     /etc/letsencrypt/live/marketplace.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketplace.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 16m;

    location /static/ {
        alias /opt/marketplace/app/static/;
        expires 30d;
        access_log off;
    }

    # Documented API surface only; keep it explicit rather than opening
    # every internal path to the internet.
    location /api/ {
        limit_req zone=marketplace_rl burst=20 nodelay;
        proxy_pass http://marketplace_app;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://marketplace_app;
        include /etc/nginx/proxy_params;
    }
}
