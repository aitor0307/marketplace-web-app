services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: marketplace-app:local
    env_file: .env
    environment:
      APP_ENV: development
      FLASK_APP: wsgi.py
      FLASK_DEBUG: "1"
      DATABASE_URL: postgresql+psycopg2://marketplace:marketplace@db:5432/marketplace
      REDIS_URL: redis://redis:6379/0
      STATSD_HOST: statsd-exporter
    command: ["flask", "run", "--host=0.0.0.0", "--port=8000"]
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/app/app/static:ro
    ports:
      - "8080:80"
    depends_on:
      - app

  # Not used by the app yet; here so the local stack matches prod's shape
  # once a Redis-vector feature actually ships and needs a StatsD sink.
  statsd-exporter:
    image: prom/statsd-exporter:v0.26.1
    command: ["--statsd.listen-udp=:8125", "--web.listen-address=:9102"]
    ports:
      - "9102:9102"
      - "8125:8125/udp"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - statsd-exporter
      - cadvisor

  grafana:
    image: grafana/grafana:11.1.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
