name: Deploy

# Push to master -> dev. Prod (or a re-deploy of dev) is a manual run:
# Actions -> Deploy -> Run workflow -> pick the environment.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev

# One deploy per environment at a time; queue rather than cancel, so a
# half-finished migration/restart is never interrupted.
concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # FILL IN: Settings -> Secrets and variables -> Actions -> Variables -> GCP_PROJECT
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  target:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      region: ${{ steps.resolve.outputs.region }}
      zone: ${{ steps.resolve.outputs.zone }}
      registry: ${{ steps.resolve.outputs.registry }}
      vm: ${{ steps.resolve.outputs.vm }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - id: resolve
        env:
          ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        # Keep in sync with terraform/live/<env>/terragrunt.hcl (region/zone)
        # and modules/marketplace-vm/main.tf (repo "marketplace-<env>", VM "marketplace-<env>-vm").
        run: |
          case "$ENVIRONMENT" in
            dev)  region=us-central1;  zone=us-central1-a ;;
            prod) region=europe-west4; zone=europe-west4-a ;;
            *) echo "Unknown environment: $ENVIRONMENT" >&2; exit 1 ;;
          esac
          {
            echo "environment=$ENVIRONMENT"
            echo "region=$region"
            echo "zone=$zone"
            echo "registry=$region-docker.pkg.dev/$GCP_PROJECT/marketplace-$ENVIRONMENT"
            echo "vm=marketplace-$ENVIRONMENT-vm"
            # Version shown in the SPA's corner: the build date (UTC), with the
            # time so several deploys on the same day stay distinguishable.
            echo "release=$(date -u +%Y.%m.%d-%H%M)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build & push ${{ matrix.image }}
    needs: [ci, target]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: app
            context: .
            dockerfile: docker/Dockerfile
            build-args: ""
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            # Empty API URL = same-origin: the VM's nginx serves the SPA and
            # proxies /api and /static to the app on one host.
            build-args: |
              VITE_API_URL=
              VITE_ENVIRONMENT=production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.target.outputs.region }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: |
            ${{ matrix.build-args }}
            VITE_RELEASE_NUMBER=${{ needs.target.outputs.release }}
          push: true
          # The VM's compose file pulls :latest; the SHA tag is for rollbacks.
          tags: |
            ${{ needs.target.outputs.registry }}/${{ matrix.image }}:${{ github.sha }}
            ${{ needs.target.outputs.registry }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to ${{ needs.target.outputs.environment }}
    needs: [target, build]
    runs-on: ubuntu-latest
    # Add required reviewers to the "prod" environment in the repo settings
    # to gate prod deploys behind an approval.
    environment: ${{ needs.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # The VM only accepts SSH from Google's IAP range and uses OS Login, so
      # gcloud tunnels through IAP and registers a short-lived key for the
      # service account instead of us managing SSH keys.
      - name: Run deploy script on the VM
        run: |
          gcloud compute ssh "${{ needs.target.outputs.vm }}" \
            --project "$GCP_PROJECT" \
            --zone "${{ needs.target.outputs.zone }}" \
            --tunnel-through-iap \
            --ssh-key-expire-after=30m \
            --strict-host-key-checking=no \
            --quiet \
            --command "sudo bash -s" < .github/scripts/deploy_vm.sh
